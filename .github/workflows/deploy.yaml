name: Deploy and syndicate

# One pipeline: build -> deploy -> post new notes to Bluesky/Mastodon ->
# commit the post URLs back into the notes -> build -> deploy again so the
# links show on the live site.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Bunny Storage and purge CDN
        uses: R-J-dev/bunny-deploy@v3.0.0
        with:
          directory-to-upload: "_site"
          storage-zone-name: ${{ secrets.BUNNY_STORAGE_ZONE }}
          storage-zone-password: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          storage-endpoint: ${{ secrets.BUNNY_STORAGE_HOSTNAME }}
          access-key: ${{ secrets.BUNNY_API_KEY }}
          pull-zone-id: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          concurrency: "50"
          replication-timeout: "15000"
          enable-delete-action: "true"
          enable-purge-pull-zone: "true"

      - name: Syndicate new notes
        id: syndicate
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: node .github/scripts/syndicate.js

      # Runs even if one network failed, so links from the other still land.
      - name: Commit post links
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git add notes/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Add syndication links to notes [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:master; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin master
            sleep 2
          done
          echo "Push failed after 3 attempts."
          exit 1

      - name: Rebuild site with links
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        run: npm run build

      - name: Redeploy
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        uses: R-J-dev/bunny-deploy@v3.0.0
        with:
          directory-to-upload: "_site"
          storage-zone-name: ${{ secrets.BUNNY_STORAGE_ZONE }}
          storage-zone-password: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          storage-endpoint: ${{ secrets.BUNNY_STORAGE_HOSTNAME }}
          access-key: ${{ secrets.BUNNY_API_KEY }}
          pull-zone-id: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          concurrency: "50"
          replication-timeout: "15000"
          enable-delete-action: "true"
          enable-purge-pull-zone: "true"
