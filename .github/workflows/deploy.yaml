name: Deploy and sync

# Every 15 minutes (and on every push): pull new Bluesky posts into notes/,
# post them to Mastodon, commit, then build and deploy if anything changed.

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Bluesky -> site -> Mastodon
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: node .github/scripts/sync.js

      # Runs even if Mastodon failed, so imported notes still go live.
      - name: Commit new notes
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git add notes/ img/notes/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync notes from Bluesky / to Mastodon [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:master; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin master
            sleep 2
          done
          echo "Push failed after 3 attempts."
          exit 1

      - name: Build site
        if: ${{ !cancelled() && (github.event_name != 'schedule' || steps.commit.outputs.changed == 'true') }}
        run: npm run build

      - name: Deploy to Bunny Storage and purge CDN
        if: ${{ !cancelled() && (github.event_name != 'schedule' || steps.commit.outputs.changed == 'true') }}
        uses: R-J-dev/bunny-deploy@v3.0.0
        with:
          directory-to-upload: "_site"
          storage-zone-name: ${{ secrets.BUNNY_STORAGE_ZONE }}
          storage-zone-password: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          storage-endpoint: ${{ secrets.BUNNY_STORAGE_HOSTNAME }}
          access-key: ${{ secrets.BUNNY_API_KEY }}
          pull-zone-id: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          concurrency: "50"
          replication-timeout: "15000"
          enable-delete-action: "true"
          enable-purge-pull-zone: "true"
